<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NZ Map Coordinates Converter</title>
  <meta name="description" content="Convert between NZ map coordinates in different formats: Google Maps, NZ Topo, lat/lng, geo URI, NZTM2000 easting/northing, NZ topo sheets">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:       #2563eb;
      --blue-dark:  #1d4ed8;
      --green:      #16a34a;
      --green-bg:   #dcfce7;
      --green-text: #15803d;
      --red:        #dc2626;
      --red-bg:     #fef2f2;
      --red-text:   #b91c1c;
      --amber-bg:   #fffbeb;
      --amber-text: #92400e;
      --amber-border: #fcd34d;
      --bg:         #f1f5f9;
      --card:       #ffffff;
      --text:       #0f172a;
      --muted:      #64748b;
      --border:     #e2e8f0;
      --radius:     8px;
      --shadow:     0 1px 3px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --blue:       #60a5fa;
        --blue-dark:  #2563eb;
        --green:      #22c55e;
        --green-bg:   #052e16;
        --green-text: #4ade80;
        --red:        #f87171;
        --red-bg:     #1c0a0a;
        --red-text:   #fca5a5;
        --amber-bg:   #1c1207;
        --amber-text: #fcd34d;
        --amber-border: #92400e;
        --bg:         #0f172a;
        --card:       #1e293b;
        --text:       #f1f5f9;
        --muted:      #cbd5e1;
        --border:     #334155;
        --shadow:     0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
      }
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;

      background: var(--blue);
      color: white;
      padding: .875rem 1.5rem;
    }
    .app-header h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: -.01em; }
    .app-header.test-header { background: #1e293b; }
    @media (prefers-color-scheme: dark) {
      .app-header.test-header { background: #0f172a; border-top: 1px solid var(--border); border-bottom: none; }
    }

    /* ── Layout ── */
    .container { max-width: 820px; margin: 0 auto; padding: 1.5rem 1rem; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    /* ── Input ── */
    .input-label { display: block; font-weight: 500; margin-bottom: .5rem; }

    .input-row { display: flex; gap: .5rem; }

    .input-wrapper { position: relative; width: 100%; min-width: 0; }

      width: 100%;
      padding: .625rem 2.25rem .625rem .875rem;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      font-family: var(--mono);
      color: var(--text);
      background: var(--card);
      outline: none;
      transition: border-color .15s;

    .coord-input:focus { border-color: var(--blue); }

    .btn-clear {
      position: absolute;
      right: .5rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: .25rem;
      display: none;

    .btn-clear:hover { color: var(--text); }

      margin-top: .75rem;
      font-size: .8125rem;
      color: var(--muted);

    .examples-toggle {
      background: none;
      border: none;
      padding: 0;

      cursor: pointer;

    .examples-pills {

      flex-wrap: wrap;
      align-items: center;

      text-decoration: none;

      color: var(--green-text);

      opacity: .75;

      grid-template-columns: minmax(120px, 175px) 1fr auto;

      color: var(--green-text);

      border: 1px solid #fecaca;
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      color: var(--red-text);
      font-size: .9375rem;

    .error-box code {
      font-family: var(--mono);
      font-size: .875em;
      background: rgba(128,128,128,.15);
      padding: .1em .35em;
      border-radius: 3px;
    }

    .warning-box {
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      border-radius: var(--radius);
      padding: .625rem 1rem;
      color: var(--amber-text);
      font-size: .875rem;
      margin-top: .75rem;
      margin-bottom: 0;

    /* ── Tests ── */
    .test-summary {
      padding: .875rem 1.25rem;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: .9375rem;
      margin-bottom: 1.25rem;

    .test-summary.pass { background: var(--green-bg); color: var(--green-text); }
    .test-summary.fail { background: var(--red-bg); color: var(--red-text); }

    .test-suite { margin-bottom: 1.25rem; }
    .test-suite-name {
      font-weight: 600;
      font-size: .95rem;
      margin-bottom: .5rem;
      padding-bottom: .375rem;
      border-bottom: 2px solid var(--border);

      display: flex;
      align-items: baseline;
      gap: .5rem;
      padding: .375rem .75rem;
      border-radius: 4px;
      margin: 2px 0;
      font-size: .875rem;

<body>
<div id="root"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════════════
// Utility helpers
// ═══════════════════════════════════════════════════════════════════════════════

function nearEqual(a, b, tol = 1e-6) {
  return Math.abs(a - b) <= tol;
}

// Bounding box covering NZ mainland, Stewart Island, and nearby coastal islands.
// Excludes distant territories (Chatham, Kermadec, Subantarctic).
function isInNZ(lat, lng) {
  return lat >= -47.5 && lat <= -34.0 && lng >= 165.5 && lng <= 178.6;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ═══════════════════════════════════════════════════════════════════════════════
// Coordinates — internal lat/lng/zoom representation
// ═══════════════════════════════════════════════════════════════════════════════

class Coordinates {
  constructor(lat, lng, zoom = null) {
    this.lat  = Math.round(parseFloat(lat) * 1e6) / 1e6;
    this.lng  = Math.round(parseFloat(lng) * 1e6) / 1e6;
    this.zoom = (zoom !== null && zoom !== undefined) ? parseFloat(zoom) : null;
  }

  toString() {
    const z = this.zoom !== null ? `, zoom ${this.zoom}` : '';
    return `${this.lat.toFixed(6)}, ${this.lng.toFixed(6)}${z}`;
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// NZTM2000 Projection  (EPSG:2193)
// Transverse Mercator on GRS80 ellipsoid
// Parameters from LINZ ICSM publication
// ═══════════════════════════════════════════════════════════════════════════════

class NZTM2000 {
  constructor() {
    this.a   = 6378137.0;           // GRS80 semi-major axis (m)
    this.f   = 1 / 298.257222101;   // GRS80 flattening
    this.e2  = 2 * this.f - this.f * this.f;           // eccentricity²
    this.ep2 = this.e2 / (1 - this.e2);                // second eccentricity²
    this.k0  = 0.9996;              // scale factor at CM
    this.lon0 = 173 * Math.PI / 180; // central meridian 173°E
    this.lat0 = 0;                  // latitude of origin
    this.E0  = 1600000;             // false easting (m)
    this.N0  = 10000000;            // false northing (m)
  }

  // Meridional arc distance from equator to latitude phi
  _M(phi) {
    const { a, e2 } = this;
    const e4 = e2 * e2, e6 = e4 * e2;
    return a * (
        (1 - e2/4 - 3*e4/64 - 5*e6/256)    * phi
      - (3*e2/8 + 3*e4/32 + 45*e6/1024)    * Math.sin(2 * phi)
      + (15*e4/256 + 45*e6/1024)            * Math.sin(4 * phi)
      - (35*e6/3072)                        * Math.sin(6 * phi)
    );
  }

  // Geographic (degrees WGS84/GRS80) → NZTM2000 easting / northing (metres)
  toNZTM(lat, lng) {
    const phi  = lat * Math.PI / 180;
    const lam  = lng * Math.PI / 180;
    const dlam = lam - this.lon0;
    const { a, e2, ep2, k0, E0, N0, lat0 } = this;

    const sp = Math.sin(phi), cp = Math.cos(phi), tp = Math.tan(phi);
    const Nrad = a / Math.sqrt(1 - e2 * sp * sp);   // radius of curvature in prime vertical
    const T  = tp * tp;
    const C  = ep2 * cp * cp;
    const A  = cp * dlam;
    const M  = this._M(phi);
    const M0 = this._M(lat0);

    const A2=A*A, A3=A2*A, A4=A3*A, A5=A4*A, A6=A5*A;

    const E = E0 + k0 * Nrad * (
        A
      + (1 - T + C) * A3 / 6
      + (5 - 18*T + T*T + 72*C - 58*ep2) * A5 / 120
    );

    const Nval = N0 + k0 * (
        M - M0
      + Nrad * tp * (
            A2 / 2
          + (5 - T + 9*C + 4*C*C) * A4 / 24
          + (61 - 58*T + T*T + 600*C - 330*ep2) * A6 / 720
        )
    );

    return { E: Math.round(E), N: Math.round(Nval) };
  }

  // NZTM2000 easting / northing (metres) → geographic (degrees WGS84/GRS80)
  fromNZTM(E, N) {
    const { a, e2, ep2, k0, lon0, lat0, E0, N0 } = this;
    const e4 = e2*e2, e6 = e4*e2;
    const M0 = this._M(lat0);

    // Footprint latitude via Bowring's series
    const e1  = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
    const M   = (N - N0) / k0 + M0;
    const mu  = M / (a * (1 - e2/4 - 3*e4/64 - 5*e6/256));

    const phi1 = mu
      + (3*e1/2   - 27*e1**3/32)    * Math.sin(2*mu)
      + (21*e1**2/16 - 55*e1**4/32) * Math.sin(4*mu)
      + (151*e1**3/96)               * Math.sin(6*mu)
      + (1097*e1**4/512)             * Math.sin(8*mu);

    const sp1 = Math.sin(phi1), cp1 = Math.cos(phi1), tp1 = Math.tan(phi1);
    const N1 = a / Math.sqrt(1 - e2 * sp1 * sp1);
    const T1 = tp1 * tp1;
    const C1 = ep2 * cp1 * cp1;
    const R1 = a * (1 - e2) / Math.pow(1 - e2 * sp1*sp1, 1.5);
    const D  = (E - E0) / (N1 * k0);

    const D2=D*D, D3=D2*D, D4=D3*D, D5=D4*D, D6=D5*D;

    const phi = phi1 - (N1 * tp1 / R1) * (
        D2 / 2
      - (5 + 3*T1 + 10*C1 - 4*C1*C1 - 9*ep2)  * D4 / 24
      + (61 + 90*T1 + 298*C1 + 45*T1*T1 - 252*ep2 - 3*C1*C1) * D6 / 720
    );

    const lam = lon0 + (
        D
      - (1 + 2*T1 + C1)                                            * D3 / 6
      + (5 - 2*C1 + 28*T1 - 3*C1*C1 + 8*ep2 + 24*T1*T1) * D5 / 120
    ) / cp1;

    return { lat: phi * 180 / Math.PI, lng: lam * 180 / Math.PI };
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// NZ Topo50 Map Sheet — sheet code calculator
// Algorithm ported from https://github.com/linz/argo-tasks/blob/master/src/utils/mapsheet.ts
// ═══════════════════════════════════════════════════════════════════════════════

class MapSheet {
  /** Top-left NZTM2000 origin of the entire sheet grid */
  static get origin()  { return { x: 988000, y: 6234000 }; }
  static get width()   { return 24000; }
  static get height()  { return 36000; }

  /**
   * Calculate the NZTM2000 top-left origin for a Topo50 sheet code.
   * @param {string} sheetCode  e.g. "BF35"
   * @returns {{ x: number, y: number }}
   */
  static offset(sheetCode) {
    const ms = sheetCode.slice(0, 2).toUpperCase();
    const x  = Number(sheetCode.slice(2));

    const charA = 'A'.charCodeAt(0);
    const baseYOffset = 'S'.charCodeAt(0) - charA;   // 18 — sheets start at "AS"
    const firstLetterOffset  = (ms.charCodeAt(0) - charA) * 26;
    const secondLetterOffset = ms.charCodeAt(1) - charA;

    let y = firstLetterOffset + secondLetterOffset - baseYOffset;

    // Three sheet codes don't exist: BI, BO, CI — adjust row index accordingly
    if      (ms > 'CI') y -= 3;
    else if (ms > 'BO') y -= 2;
    else if (ms > 'BI') y -= 1;

    return {
      x: MapSheet.width  * x + MapSheet.origin.x,
      y: MapSheet.origin.y - MapSheet.height * y,
    };
  }

  /**
   * Calculate the Topo50 sheet code for a NZTM2000 x/y point.
   * @param {number} x  NZTM2000 Easting
   * @param {number} y  NZTM2000 Northing
   * @returns {string}  e.g. "BF35"
   */
  static sheetCode(x, y) {
    const charA = 'A'.charCodeAt(0);

    const offsetX = Math.floor((x - MapSheet.origin.x) / MapSheet.width);
    const offsetY = Math.floor((MapSheet.origin.y - y) / MapSheet.height);

    let charYOffset = offsetY;
    if (charYOffset >= 16) charYOffset++;  // BI gap
    if (charYOffset >= 22) charYOffset++;  // BO gap
    if (charYOffset >= 42) charYOffset++;  // CI gap

    const baseYOffset = 'S'.charCodeAt(0) - charA;   // 18
    charYOffset += baseYOffset;

    const firstLetter  = String.fromCharCode(Math.floor(charYOffset / 26) + charA);
    const secondLetter = String.fromCharCode((charYOffset % 26) + charA);
    return `${firstLetter}${secondLetter}${String(offsetX).padStart(2, '0')}`;
  }

  /**
   * Return true if the sheet code falls within LINZ's known valid ranges.
   * @param {string} sheet  e.g. "BF35"
   */
  static isKnown(sheet) {
    const key   = sheet.slice(0, 2).toUpperCase();
    const index = Number(sheet.slice(2, 4));
    if (Number.isNaN(index)) return false;
    const ranges = MapSheet.sheetRanges[key];
    if (!ranges) return false;
    for (const [low, high] of ranges) {
      if (low <= index && index <= high) return true;
    }
    return false;
  }

  /** Valid sheet column ranges per row (from LINZ argo-tasks SheetRanges) */
  static get sheetRanges() {
    return {
      AS: [[21,22],[24,24]],  AT: [[23,26]],          AU: [[24,29]],
      AV: [[24,30]],          AW: [[25,32]],          AX: [[27,33]],
      AY: [[28,35]],          AZ: [[28,36]],          BA: [[29,37]],
      BB: [[30,37]],          BC: [[30,38],[40,41]],  BD: [[31,46]],
      BE: [[31,46]],          BF: [[30,45]],          BG: [[29,45]],
      BH: [[28,44]],          BJ: [[27,43]],          BK: [[28,40]],
      BL: [[28,40]],          BM: [[23,25],[32,39]],  BN: [[22,29],[32,38]],
      BP: [[22,37]],          BQ: [[21,36]],          BR: [[19,30],[32,34]],
      BS: [[19,29]],          BT: [[18,28]],          BU: [[16,27]],
      BV: [[15,27]],          BW: [[14,26]],          BX: [[12,26]],
      BY: [[10,26]],          BZ: [[ 8,23]],          CA: [[ 7,22]],
      CB: [[ 6,20]],          CC: [[ 5,20]],          CD: [[ 4,19]],
      CE: [[ 4,18]],          CF: [[ 4,17]],          CG: [[ 4,16]],
      CH: [[ 5,14]],          CJ: [[ 7,11]],          CK: [[ 7, 9]],
    };
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// Base MapService class
// ═══════════════════════════════════════════════════════════════════════════════

class MapService {
  /** Human-readable name shown in the UI */
  get name() { throw new Error('name not implemented'); }

  /** True when generate() returns an http(s)/geo URL */
  get isURL() { return false; }

  /** True when this service only makes sense for NZ coordinates */
  get nzOnly() { return false; }

  /** Returns true if this service can attempt to parse the given string */
  canParse(input) { throw new Error('canParse not implemented'); }

  /** Parse input → Coordinates (or null on failure) */
  parse(input) { throw new Error('parse not implemented'); }

  /** Coordinates → canonical string / URL for this service */
  generate(coords) { throw new Error('generate not implemented'); }

  /** Array of { name, run(), expected } test cases */
  getTests() { return []; }

  /** A representative example input string for this service */
  exampleValue() { throw new Error('exampleValue not implemented'); }
}

// ═══════════════════════════════════════════════════════════════════════════════
// Google Maps
// ═══════════════════════════════════════════════════════════════════════════════

class GoogleMapsService extends MapService {
  get name()  { return 'Google Maps'; }
  get isURL() { return true; }
  exampleValue() { return 'https://www.google.com/maps/@-41.28,174.78,15z'; }

  canParse(input) {
    return /https?:\/\/(www\.|maps\.)?google\.[a-z.]{2,6}\/maps/i.test(input);
  }

  parse(input) {
    // /@lat,lng,{N}z  or  /@lat,lng,{N}m
    const atM = input.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*),([\d.]+)([mz])/i);
    if (atM) {
      const lat = parseFloat(atM[1]);
      const lng = parseFloat(atM[2]);
      const val = parseFloat(atM[3]);
      let zoom;
      if (atM[4].toLowerCase() === 'z') {
        zoom = val;
      } else {
        // metres → approximate zoom using Web Mercator ground resolution
        const res = Math.cos(lat * Math.PI / 180) * 40075016.686 / val;
        zoom = Math.max(1, Math.min(21, Math.round(Math.log2(res))));
      }
      return new Coordinates(lat, lng, zoom);
    }
    // query=lat,lng  or  query=lat%2Clng
    const qM = input.match(/[?&]query=(-?\d+\.?\d*)[,%2C]+(-?\d+\.?\d*)/i);
    if (qM) return new Coordinates(parseFloat(qM[1]), parseFloat(qM[2]));
    // ?q=lat,lng
    const q2 = input.match(/[?&]q=(-?\d+\.?\d*),(-?\d+\.?\d*)/);
    if (q2) return new Coordinates(parseFloat(q2[1]), parseFloat(q2[2]));

    return null;
  }

  generate(coords) {
    return `https://www.google.com/maps/search/?api=1&query=${coords.lat}%2C${coords.lng}`;
  }

  getTests() {
    const svc = new GoogleMapsService();
    return [
      {

class GeoURIService extends MapService {
  get name()  { return 'Geo URI'; }
  get isURL() { return true; }
  exampleValue() { return 'geo:-41.2865,174.7762?z=13'; }

  canParse(input) {
    return /^geo:/i.test(input.trim());

  parse(input) {

    const m = input.trim().match(
      /^geo:(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)(?:,[\d.]+)?(?:\?(.*))?/i

// NZ Easting / Northing  (NZTM2000, EPSG:2193)
// Formats: "E 1845100 N 5743800"  or  "1845100E 5743800N"
// ═══════════════════════════════════════════════════════════════════════════════

class NZTMEastingNorthingService extends MapService {
  constructor() {
    super();
    this._proj = new NZTM2000();
  }

  get name()  { return 'NZTM Easting/Northing'; }
  get isURL() { return false; }
  get nzOnly() { return true; }
  exampleValue() { return 'E 1745900 N 5427600'; }

  canParse(input) {
    const t = input.trim();
    return /^E\s*\d{6,8}[\s,]+N\s*\d{6,8}$/i.test(t) ||
           /^\d{6,8}\s*E[\s,]+\d{6,8}\s*N$/i.test(t);
  }

  parse(input) {
    const t = input.trim();
    // "E 1845100 N 5743800" style
    let m = t.match(/^E\s*(\d+)[\s,]+N\s*(\d+)$/i);
    // "1845100E 5743800N" style
    if (!m) m = t.match(/^(\d+)\s*E[\s,]+(\d+)\s*N$/i);
    if (!m) return null;
    const { lat, lng } = this._proj.fromNZTM(parseInt(m[1]), parseInt(m[2]));
    return new Coordinates(lat, lng);
  }

  generate(coords) {
    const { E, N } = this._proj.toNZTM(coords.lat, coords.lng);
    return `E ${E} N ${N}`;

// ═══════════════════════════════════════════════════════════════════════════════
// NZ Topo50 Sheet Code
// Format: "BF35 451 438" — sheet code + 3-digit easting ref + 3-digit northing ref
//   Each digit unit = 100 m (last 3 digits of NZTM coord ÷ 100)
// ═══════════════════════════════════════════════════════════════════════════════

class NZTopoSheetService extends MapService {
  constructor() {
    super();
    this._proj = new NZTM2000();
  }

  get name()  { return 'NZ Topo50 Sheet'; }
  get isURL() { return false; }
  get nzOnly() { return true; }
  exampleValue() { return 'BF35 451 438'; }

  canParse(input) {
    return /^[A-Z]{2}\d{2}\s*\d{3}\s*\d{3}$/i.test(input.trim());
  }

  parse(input) {
    const m = input.trim().match(/^([A-Z]{2}\d{2})\s*(\d{3})\s*(\d{3})$/i);
    if (!m) return null;

    const code = m[1].toUpperCase();
    const refE  = parseInt(m[2], 10);
    const refN  = parseInt(m[3], 10);

    // Get top-left (NW) corner of the sheet, then derive SW corner
    const origin = MapSheet.offset(code);
    const swX    = origin.x;
    const swY    = origin.y - MapSheet.height;

    // Reconstruct full NZTM coordinates from 100 m grid references
    let E = Math.floor(swX / 100000) * 100000 + refE * 100;
    if (E < swX) E += 100000;   // handle 100 km grid boundary crossing

    let N = Math.floor(swY / 100000) * 100000 + refN * 100;
    if (N < swY) N += 100000;

    const { lat, lng } = this._proj.fromNZTM(E, N);
    return new Coordinates(lat, lng);
  }

  generate(coords) {
    const { E, N } = this._proj.toNZTM(coords.lat, coords.lng);
    const code = MapSheet.sheetCode(E, N);
    const refE = String(Math.round(E / 100) % 1000).padStart(3, '0');
    const refN = String(Math.round(N / 100) % 1000).padStart(3, '0');
    return `${code} ${refE} ${refN}`;
  }

  getTests() {
    const svc  = new NZTopoSheetService();
    const near = (a, b, tol = 1e-3) => Math.abs(a - b) <= tol;

    return [
      // canParse
      { name: 'Detect sheet ref "BF35 451 438"',
        run: () => svc.canParse('BF35 451 438'), expected: true },
      { name: 'Detect sheet ref without spaces "BF35451438"',
        run: () => svc.canParse('BF35451438'), expected: true },
      { name: 'Parse without spaces matches parse with spaces',
        run: () => {
          const a = svc.parse('BF35 451 438');
          const b = svc.parse('BF35451438');
          return nearEqual(a.lat, b.lat) && nearEqual(a.lng, b.lng);
        }, expected: true },
      { name: 'Reject decimal lat/lng',
        run: () => svc.canParse('-41.2865,174.7762'), expected: false },
      { name: 'exampleValue() is recognised by canParse',
        run: () => svc.canParse(svc.exampleValue()), expected: true },
      { name: 'Reject incomplete ref "BF35 451"',
        run: () => svc.canParse('BF35 451'), expected: false },

      // MapSheet.offset (values from LINZ argo-tasks test suite)
      { name: 'MapSheet.offset("AS00") → x=988000, y=6234000',
        run: () => { const o = MapSheet.offset('AS00'); return o.x === 988000 && o.y === 6234000; },
        expected: true },
      { name: 'MapSheet.offset("AS21") → x=1492000, y=6234000',
        run: () => { const o = MapSheet.offset('AS21'); return o.x === 1492000 && o.y === 6234000; },
        expected: true },
      { name: 'MapSheet.offset("BG33") → x=1780000, y=5730000',
        run: () => { const o = MapSheet.offset('BG33'); return o.x === 1780000 && o.y === 5730000; },
        expected: true },
      { name: 'MapSheet.offset("BW14") → x=1324000, y=5226000',
        run: () => { const o = MapSheet.offset('BW14'); return o.x === 1324000 && o.y === 5226000; },
        expected: true },

      // MapSheet.sheetCode
      { name: 'MapSheet.sheetCode(988000, 6234000) → "AS00"',
        run: () => MapSheet.sheetCode(988000, 6234000) === 'AS00', expected: true },
      { name: 'MapSheet.sheetCode(988000, 5982000) → "AZ00"',
        run: () => MapSheet.sheetCode(988000, 5982000) === 'AZ00', expected: true },
      { name: 'MapSheet.sheetCode(1780000, 5730000) → "BG33"',
        run: () => MapSheet.sheetCode(1780000, 5730000) === 'BG33', expected: true },

      // MapSheet.isKnown
      { name: 'MapSheet.isKnown("BF35") → true',
        run: () => MapSheet.isKnown('BF35'), expected: true },
      { name: 'MapSheet.isKnown("AS21") → true',
        run: () => MapSheet.isKnown('AS21'), expected: true },
      { name: 'MapSheet.isKnown("AA14") → false (not in grid)',
        run: () => MapSheet.isKnown('AA14'), expected: false },

      // Parse against known E/N (BF35 451 438 ↔ E 1845100 N 5743800 per original spec)
      { name: 'Parse "BF35 451 438" → coords within NZ',
        run: () => {
          const c = svc.parse('BF35 451 438');
          return c.lat > -48 && c.lat < -34 && c.lng > 165 && c.lng < 179;
        }, expected: true },
      { name: 'Parse "BF35 451 438" matches E 1845100 N 5743800',
        run: () => {
          const c = svc.parse('BF35 451 438');
          const { E, N } = new NZTM2000().toNZTM(c.lat, c.lng);
          return Math.abs(E - 1845100) < 1 && Math.abs(N - 5743800) < 1;
        }, expected: true },

      // Round-trips (100 m ≈ 0.001° tolerance)
      { name: 'Round-trip Wellington within 100 m',
        run: () => {
          const orig = new Coordinates(-41.2865, 174.7762);
          const back = svc.parse(svc.generate(orig));
          return near(back.lat, orig.lat) && near(back.lng, orig.lng);
        }, expected: true },
      { name: 'Round-trip Auckland within 100 m',
        run: () => {
          const orig = new Coordinates(-36.8485, 174.7633);
          const back = svc.parse(svc.generate(orig));
          return near(back.lat, orig.lat) && near(back.lng, orig.lng);
        }, expected: true },
      { name: 'Round-trip Christchurch within 100 m',
        run: () => {

          const back = svc.parse(svc.generate(orig));
          return near(back.lat, orig.lat) && near(back.lng, orig.lng);
        }, expected: true },

      // ── Gap boundary round-trips ──────────────────────────────────────────
      // Each pair straddles a missing code (BI, BO, CI) to catch off-by-one errors.
      { name: 'Round-trip BH00 (last code before BI gap)',
        run: () => MapSheet.sheetCode(MapSheet.offset('BH00').x, MapSheet.offset('BH00').y) === 'BH00',
        expected: true },
      { name: 'Round-trip BJ00 (first code after BI gap)',
        run: () => MapSheet.sheetCode(MapSheet.offset('BJ00').x, MapSheet.offset('BJ00').y) === 'BJ00',
        expected: true },
      { name: 'Round-trip BN00 (last code before BO gap)',
        run: () => MapSheet.sheetCode(MapSheet.offset('BN00').x, MapSheet.offset('BN00').y) === 'BN00',
        expected: true },
      { name: 'Round-trip BP00 (first code after BO gap)',
        run: () => MapSheet.sheetCode(MapSheet.offset('BP00').x, MapSheet.offset('BP00').y) === 'BP00',
        expected: true },
      { name: 'Round-trip CH00 (last code before CI gap)',
        run: () => MapSheet.sheetCode(MapSheet.offset('CH00').x, MapSheet.offset('CH00').y) === 'CH00',
        expected: true },
      { name: 'Round-trip CJ00 (first code after CI gap)',
        run: () => MapSheet.sheetCode(MapSheet.offset('CJ00').x, MapSheet.offset('CJ00').y) === 'CJ00',
        expected: true },

      // ── BI→BO cascade (offsetY=21 triggers both gap corrections) ─────────
      // If the second gap check were `else if`, this would silently produce 'BO00'.
      { name: 'BI→BO cascade: offsetY=21 produces BP00 not BO00',
        run: () => {
          const y = MapSheet.origin.y - 21 * MapSheet.height;
          return MapSheet.sheetCode(MapSheet.origin.x, y) === 'BP00';
        }, expected: true },

      // ── Gap codes are never generated ─────────────────────────────────────
      { name: 'sheetCode never produces BI',
        run: () => {
          const y = MapSheet.origin.y - 16 * MapSheet.height;
          return MapSheet.sheetCode(MapSheet.origin.x, y) !== 'BI00';
        }, expected: true },
      { name: 'sheetCode never produces BO',
        run: () => {
          const y = MapSheet.origin.y - 21 * MapSheet.height;
          return MapSheet.sheetCode(MapSheet.origin.x, y) !== 'BO00';
        }, expected: true },
      { name: 'sheetCode never produces CI',
        run: () => {
          const y = MapSheet.origin.y - 40 * MapSheet.height;
          return MapSheet.sheetCode(MapSheet.origin.x, y) !== 'CI00';
        }, expected: true },

      // ── isKnown boundary cases ────────────────────────────────────────────
      { name: 'isKnown("AS21") → true (first valid NZ sheet)',
        run: () => MapSheet.isKnown('AS21'), expected: true },
      { name: 'isKnown("AS20") → false (just outside range)',
        run: () => MapSheet.isKnown('AS20'), expected: false },
      { name: 'isKnown("CK09") → true (last valid NZ sheet)',
        run: () => MapSheet.isKnown('CK09'), expected: true },
      { name: 'isKnown("CK10") → false (just outside range)',
        run: () => MapSheet.isKnown('CK10'), expected: false },
    ];
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// Degrees Minutes Seconds  (DMS)
// Formats: "41°17'11.4"S, 174°46'34.3"E"  or  "S41°17'11.4", E174°46'34.3""
// Hemisphere letters (N/S/E/W) may appear before or after the value.
// ═══════════════════════════════════════════════════════════════════════════════

class DegreesMinutesSecondsService extends MapService {
  get name()  { return 'Degrees Minutes Seconds'; }
  get isURL() { return false; }
  exampleValue() { return '42°6\'55.2672"S, 171°19\'46.1064"E'; }

  // Regex for one DMS component: [H]DDD°MM'SS.s"[H]
  // Degree symbol: ° (U+00B0) or º (U+00BA ordinal)
  // Minute symbol: ′ (U+2032) or ASCII apostrophe
  // Second symbol: ″ (U+2033) or ASCII double-quote
  static _partRe() {
    return String.raw`([NSEW]?)\s*(\d{1,3})[°º]\s*(\d{1,2})[′']\s*(\d{1,2}(?:\.\d+)?)[″"]\s*([NSEW]?)`;
  }

  static _fullRe() {
    const p = DegreesMinutesSecondsService._partRe();
    return new RegExp(`^\\s*${p}\\s*[,;]\\s*${p}\\s*$`, 'i');
  }

  canParse(input) {
    // Must contain a degree symbol to avoid collisions with other formats
    if (!/[°º]/.test(input)) return false;
    return DegreesMinutesSecondsService._fullRe().test(input.trim());
  }

  _parsePart(hPre, deg, min, sec, hSuf) {
    const h   = (hPre || hSuf).toUpperCase();
    const val = parseFloat(deg) + parseFloat(min) / 60 + parseFloat(sec) / 3600;
    return (h === 'S' || h === 'W') ? -val : val;
  }

  parse(input) {
    const m = DegreesMinutesSecondsService._fullRe().exec(input.trim());
    if (!m) return null;

    // Groups: [1]=h1pre [2]=deg1 [3]=min1 [4]=sec1 [5]=h1suf
    //         [6]=h2pre [7]=deg2 [8]=min2 [9]=sec2 [10]=h2suf
    const first  = this._parsePart(m[1], m[2], m[3], m[4], m[5]);
    const second = this._parsePart(m[6], m[7], m[8], m[9], m[10]);

    // Detect lat/lng order from hemisphere letters
    const h1 = (m[1] || m[5]).toUpperCase();
    if (h1 === 'E' || h1 === 'W') {
      // First component is longitude — swap
      return new Coordinates(second, first);
    }
    // N/S or no hemisphere letter → first is latitude
    return new Coordinates(first, second);
  }

  _toDMS(decimal) {
    const abs     = Math.abs(decimal);
    let   deg     = Math.floor(abs);
    const minFull = (abs - deg) * 60;
    let   min     = Math.floor(minFull);
    let   sec     = (minFull - min) * 60;

    // Floating-point arithmetic can produce seconds values like 59.9964 which
    // toFixed(1) rounds up to "60.0". Roll over into the next minute/degree.
    if (parseFloat(sec.toFixed(1)) >= 60) {
      sec = 0;
      min += 1;
      if (min >= 60) { min = 0; deg += 1; }
    }

    return { deg, min, sec };
  }

  generate(coords) {
    const lat  = this._toDMS(coords.lat);
    const lng  = this._toDMS(coords.lng);
    const latH = coords.lat >= 0 ? 'N' : 'S';
    const lngH = coords.lng >= 0 ? 'E' : 'W';
    return `${lat.deg}°${lat.min}'${lat.sec.toFixed(1)}"${latH}, ${lng.deg}°${lng.min}'${lng.sec.toFixed(1)}"${lngH}`;
  }

  getTests() {
    const svc = new DegreesMinutesSecondsService();
    return [
      {
        name: 'Parse exampleValue coordinates correctly',
        run: () => {
          const c = svc.parse('42°6\'55.2672"S, 171°19\'46.1064"E');
          const expectedLat = -(42 + 6/60 + 55.2672/3600);
          const expectedLng =   171 + 19/60 + 46.1064/3600;
          return nearEqual(c.lat, expectedLat, 1e-6) && nearEqual(c.lng, expectedLng, 1e-6);
        },
        expected: true
      },
      {
        name: 'Detect suffix-hemisphere DMS',
        run: () => svc.canParse('41°17\'11.4"S, 174°46\'34.3"E'),
        expected: true
      },
      {
        name: 'Detect prefix-hemisphere DMS',
        run: () => svc.canParse('S41°17\'11.4", E174°46\'34.3"'),
        expected: true
      },
      {
        name: 'Does not match decimal lat/lng (no degree symbol)',
        run: () => svc.canParse('-41.2865, 174.7762'),
        expected: false
      },
      {
        name: 'Does not match URL',
        run: () => svc.canParse('https://www.google.com/maps/@-41.28,174.78,15z'),
        expected: false
      },
      {
        name: 'exampleValue() is recognised by canParse',
        run: () => svc.canParse(svc.exampleValue()),
        expected: true
      },
      {
        name: 'Parse suffix-hemisphere: Wellington within 0.0001°',
        run: () => {
          const c = svc.parse('41°17\'11.4"S, 174°46\'34.3"E');
          return nearEqual(c.lat, -41.2865, 1e-4) && nearEqual(c.lng, 174.7762, 1e-4);
        },
        expected: true
      },
      {
        name: 'Parse prefix-hemisphere: Wellington within 0.0001°',
        run: () => {
          const c = svc.parse('S41°17\'11.4", E174°46\'34.3"');
          return nearEqual(c.lat, -41.2865, 1e-4) && nearEqual(c.lng, 174.7762, 1e-4);
        },
        expected: true
      },
      {
        name: 'Parse prefix-hemisphere E-first: Auckland within 0.001°',
        run: () => {
          // E comes first → second component is latitude
          const c = svc.parse('E174°45\'48", S36°51\'2.4"');
          return nearEqual(c.lat, -36.8507, 1e-3) && nearEqual(c.lng, 174.763, 1e-3);
        },
        expected: true
      },
      {
        name: 'lat is negative for S hemisphere',
        run: () => svc.parse('41°0\'0"S, 174°0\'0"E').lat < 0,
        expected: true
      },
      {
        name: 'lng is positive for E hemisphere',
        run: () => svc.parse('41°0\'0"S, 174°0\'0"E').lng > 0,
        expected: true
      },
      {
        name: 'Round-trip Wellington within 0.0001°',
        run: () => {
          const orig = new Coordinates(-41.2865, 174.7762);
          const back = svc.parse(svc.generate(orig));
          return nearEqual(back.lat, orig.lat, 1e-4) && nearEqual(back.lng, orig.lng, 1e-4);
        },
        expected: true
      },
      {
        name: 'Round-trip Auckland within 0.0001°',
        run: () => {
          const orig = new Coordinates(-36.8485, 174.7633);
          const back = svc.parse(svc.generate(orig));
          return nearEqual(back.lat, orig.lat, 1e-4) && nearEqual(back.lng, orig.lng, 1e-4);
        },
        expected: true
      },
      {
        name: 'Round-trip Christchurch within 0.0001°',
        run: () => {
          const orig = new Coordinates(-43.5321, 172.6362);
          const back = svc.parse(svc.generate(orig));
          return nearEqual(back.lat, orig.lat, 1e-4) && nearEqual(back.lng, orig.lng, 1e-4);
        },
        expected: true
      },
      {
        name: 'generate() never produces seconds >= 60 (seconds rollover)',
        run: () => {
          // -41.29999 raw seconds = 59.964, which toFixed(1) rounds to "60.0" without the fix
          const out = svc.generate(new Coordinates(-41.29999, 174.0));
          return !out.includes("60.0\"");
        },
        expected: true
      },
      {
        name: 'generate() rolls seconds over into minutes correctly',
        run: () => {
          const out = svc.generate(new Coordinates(-41.29999, 174.0));
          // should produce 41°18'0.0"S not 41°17'60.0"S
          return out.startsWith('41°18\'');
        },
        expected: true
      },
      {
        name: 'generate() rolls minutes over into degrees correctly',
        run: () => {
          // -36.99999 → raw sec = 59.964 → rolls to min=60 → deg rollover
          const out = svc.generate(new Coordinates(-36.99999, 174.0));
          return out.startsWith('37°0\'');
        },
        expected: true
      }
    ];
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// Decimal Degrees Minutes  (DDM)
// Format: 41°17.190'S, 174°46.572'E
// Like DMS but with decimal minutes and no seconds component.
// Common on GPS hardware (Garmin etc.) and many NZ tramping apps.
// ═══════════════════════════════════════════════════════════════════════════════

class DecimalDegreesMinutesService extends MapService {
  get name()  { return 'Decimal Degrees Minutes'; }
  get isURL() { return false; }
  exampleValue() { return '41°17.190\'S, 174°46.572\'E'; }

  // Regex for one DDM component: [H]DDD°MM.mmm'[H]
  static _partRe() {
    return String.raw`([NSEW]?)\s*(\d{1,3})[°º]\s*(\d{1,2}(?:\.\d+)?)[′']\s*([NSEW]?)`;
  }

  static _fullRe() {
    const p = DecimalDegreesMinutesService._partRe();
    return new RegExp(`^\\s*${p}\\s*[,;]\\s*${p}\\s*$`, 'i');
  }

  canParse(input) {
    if (!/[°º]/.test(input)) return false;
    // Reject DMS — if a seconds symbol is present this is DMS not DDM
    if (/[″"]/.test(input)) return false;
    return DecimalDegreesMinutesService._fullRe().test(input.trim());
  }

  _parsePart(hPre, deg, min, hSuf) {
    const h   = (hPre || hSuf).toUpperCase();
    const val = parseFloat(deg) + parseFloat(min) / 60;
    return (h === 'S' || h === 'W') ? -val : val;
  }

  parse(input) {
    const m = DecimalDegreesMinutesService._fullRe().exec(input.trim());
    if (!m) return null;

    // Groups: [1]=h1pre [2]=deg1 [3]=min1 [4]=h1suf
    //         [5]=h2pre [6]=deg2 [7]=min2 [8]=h2suf
    const first  = this._parsePart(m[1], m[2], m[3], m[4]);
    const second = this._parsePart(m[5], m[6], m[7], m[8]);

    const h1 = (m[1] || m[4]).toUpperCase();
    if (h1 === 'E' || h1 === 'W') {
      return new Coordinates(second, first);
    }
    return new Coordinates(first, second);
  }

  _toDDM(decimal) {
    const abs = Math.abs(decimal);
    let   deg = Math.floor(abs);
    let   min = (abs - deg) * 60;

    // Guard against toFixed(3) rounding minutes up to 60.000
    if (parseFloat(min.toFixed(3)) >= 60) { min = 0; deg += 1; }

    return { deg, min };
  }

  generate(coords) {
    const lat  = this._toDDM(coords.lat);
    const lng  = this._toDDM(coords.lng);
    const latH = coords.lat >= 0 ? 'N' : 'S';
    const lngH = coords.lng >= 0 ? 'E' : 'W';
    return `${lat.deg}°${lat.min.toFixed(3)}'${latH}, ${lng.deg}°${lng.min.toFixed(3)}'${lngH}`;
  }

  getTests() {
    const svc = new DecimalDegreesMinutesService();
    return [
      {
        name: 'Detect suffix-hemisphere DDM',
        run: () => svc.canParse('41°17.190\'S, 174°46.572\'E'),
        expected: true
      },
      {
        name: 'Detect prefix-hemisphere DDM',
        run: () => svc.canParse('S41°17.190\', E174°46.572\''),
        expected: true
      },
      {
        name: 'Does not match DMS (has seconds symbol)',
        run: () => svc.canParse('41°17\'11.4"S, 174°46\'34.3"E'),
        expected: false
      },
      {
        name: 'Does not match decimal lat/lng (no degree symbol)',
        run: () => svc.canParse('-41.2865, 174.7762'),
        expected: false
      },
      {
        name: 'Does not match URL',
        run: () => svc.canParse('https://www.google.com/maps/@-41.28,174.78,15z'),
        expected: false
      },
      {
        name: 'exampleValue() is recognised by canParse',
        run: () => svc.canParse(svc.exampleValue()),
        expected: true
      },
      {
        name: 'Parse suffix-hemisphere: Wellington within 0.0001°',
        run: () => {
          const c = svc.parse('41°17.190\'S, 174°46.572\'E');
          return nearEqual(c.lat, -41.2865, 1e-4) && nearEqual(c.lng, 174.7762, 1e-4);
        },
        expected: true
      },
      {
        name: 'Parse prefix-hemisphere: Wellington within 0.0001°',
        run: () => {
          const c = svc.parse('S41°17.190\', E174°46.572\'');
          return nearEqual(c.lat, -41.2865, 1e-4) && nearEqual(c.lng, 174.7762, 1e-4);
        },
        expected: true
      },
      {
        name: 'lat is negative for S hemisphere',
        run: () => svc.parse('41°17.190\'S, 174°46.572\'E').lat < 0,
        expected: true
      },
      {
        name: 'lng is positive for E hemisphere',
        run: () => svc.parse('41°17.190\'S, 174°46.572\'E').lng > 0,
        expected: true
      },
      {
        name: 'generate() never produces minutes >= 60 (minutes rollover)',
        run: () => {
          const out = svc.generate(new Coordinates(-41.99999, 174.0));
          return !out.includes("60.000'");
        },
        expected: true
      },
      {
        name: 'generate() rolls minutes over into degrees correctly',
        run: () => {
          // -41.999992 → min = 59.99952, toFixed(3) rounds to "60.000" → deg rollover
          const out = svc.generate(new Coordinates(-41.999992, 174.0));
          return out.startsWith('42°0.000\'');
        },
        expected: true
      },
      {
        name: 'Round-trip Wellington within 0.0001°',
        run: () => {
          const orig = new Coordinates(-41.2865, 174.7762);
          const back = svc.parse(svc.generate(orig));
          return nearEqual(back.lat, orig.lat, 1e-4) && nearEqual(back.lng, orig.lng, 1e-4);
        },
        expected: true
      },
      {
        name: 'Round-trip Auckland within 0.0001°',
        run: () => {
          const orig = new Coordinates(-36.8485, 174.7633);
          const back = svc.parse(svc.generate(orig));
          return nearEqual(back.lat, orig.lat, 1e-4) && nearEqual(back.lng, orig.lng, 1e-4);
        },
        expected: true
      },
      {
        name: 'Round-trip Christchurch within 0.0001°',
        run: () => {
          const orig = new Coordinates(-43.5321, 172.6362);
          const back = svc.parse(svc.generate(orig));
          return nearEqual(back.lat, orig.lat, 1e-4) && nearEqual(back.lng, orig.lng, 1e-4);
        },
        expected: true
      }
    ];
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// Service Registry — owns the ordered list of all services
// ═══════════════════════════════════════════════════════════════════════════════

class ServiceRegistry {
  constructor() {
    this.services = [
      new LatLngService(),
      new LINZBasemapsService(),
      new GoogleMapsService(),
      new NZTopoSheetService(),
      new NZTMEastingNorthingService(),
      new NZTopoService(),
      new GeoURIService(),
      new AppleMapsService(),
      new DegreesMinutesSecondsService(),
      new DecimalDegreesMinutesService(),
    ];
  }

  /** Return the first service that claims it can parse the input */
  detect(input) {
    const trimmed = input.trim();
    return this.services.find(s => s.canParse(trimmed)) ?? null;
  }

  /**
   * Parse input, detect its service, and return:
   *   { detectedService, coords, links: [{ service, value }] }
   * Returns null if no service matches.
   */
  convert(input) {
    const service = this.detect(input);
    if (!service) return null;
    const coords  = service.parse(input.trim());
    if (!coords)  return null;
    const links = this.services
      .filter(s => s !== service)
      .map(s => ({ service: s, value: s.generate(coords) }));
    return { detectedService: service, coords, links };
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// TestRunner
// ═══════════════════════════════════════════════════════════════════════════════

class TestRunner {
  constructor(registry) {
    this.registry = registry;
  }

  runAll() {
    const suites = [];

    // Service tests
    for (const svc of this.registry.services) {
      const tests = svc.getTests().map(t => this._run(t));
      if (tests.length) suites.push({ name: svc.name, tests });
    }

    // Utility suites
    suites.push(...this._coordinatesTests());
    suites.push(...this._isInNZTests());
    suites.push(...this._registryTests());

    return suites;
  }

  _coordinatesTests() {
    const tests = [
      {
        name: '7dp lat rounds to 6dp',
        run: () => new Coordinates(-41.1234567, 174.0).lat === -41.123457,
        expected: true
      },
      {
        name: '7dp lng rounds to 6dp',
        run: () => new Coordinates(-41.0, 174.1234567).lng === 174.123457,
        expected: true
      },
      {
        name: 'Exactly 6dp is unchanged',
        run: () => new Coordinates(-41.123456, 174.123456).lat === -41.123456,
        expected: true
      },
      {
        name: 'Negative values: .5 rounds toward +∞ (Math.round behaviour)',
        run: () => new Coordinates(-41.1234565, 174.0).lat === -41.123456,
        expected: true
      },
    ].map(t => this._run(t));
    return [{ name: 'Coordinates', tests }];
  }

  _isInNZTests() {
    const tests = [
      { name: 'Wellington is in NZ',        run: () => isInNZ(-41.2865, 174.7762), expected: true  },
      { name: 'Auckland is in NZ',           run: () => isInNZ(-36.8485, 174.7633), expected: true  },
      { name: 'London is not in NZ',         run: () => isInNZ(51.5074, -0.1278),   expected: false },
      { name: 'Sydney is not in NZ',         run: () => isInNZ(-33.8688, 151.2093), expected: false },
      { name: 'South boundary (-47.5) in',   run: () => isInNZ(-47.5, 172.0),       expected: true  },
      { name: 'North boundary (-34.0) in',   run: () => isInNZ(-34.0, 172.0),       expected: true  },
      { name: 'West boundary (165.5) in',    run: () => isInNZ(-41.0, 165.5),       expected: true  },
      { name: 'East boundary (178.6) in',    run: () => isInNZ(-41.0, 178.6),       expected: true  },
      { name: 'Just south of NZ (-47.51)',   run: () => isInNZ(-47.51, 172.0),      expected: false },
      { name: 'Just north of NZ (-33.99)',   run: () => isInNZ(-33.99, 172.0),      expected: false },
      { name: 'Just west of NZ (165.49)',    run: () => isInNZ(-41.0, 165.49),      expected: false },
      { name: 'Just east of NZ (178.61)',    run: () => isInNZ(-41.0, 178.61),      expected: false },
    ].map(t => this._run(t));
    return [{ name: 'isInNZ', tests }];
  }

  _registryTests() {
    const tests = this.registry.services.map(svc => ({
      name: `${svc.name}: exampleValue() is detected as itself`,
      run: () => this.registry.detect(svc.exampleValue()) === svc,
      expected: true
    })).map(t => this._run(t));

    // Check no two services both claim to parse the same example input
    const ambiguityTests = this.registry.services.map(svc => ({
      name: `${svc.name}: no other service also claims its exampleValue()`,
      run: () => this.registry.services.filter(s => s.canParse(svc.exampleValue())).length === 1,
      expected: true
    })).map(t => this._run(t));

    const nzOnlyServices = ['NZTM Easting/Northing', 'NZ Topo50 Sheet'];
    const nzOnlyTests = [
      ...nzOnlyServices.map(name => ({
        name: `${name}: nzOnly === true`,
        run: () => this.registry.services.find(s => s.name === name)?.nzOnly,
        expected: true
      })),
      ...this.registry.services
        .filter(s => !nzOnlyServices.includes(s.name))
        .map(s => ({
          name: `${s.name}: nzOnly === false`,
          run: () => s.nzOnly,
          expected: false
        })),
    ].map(t => this._run(t));

    return [{ name: 'ServiceRegistry', tests: [...tests, ...ambiguityTests, ...nzOnlyTests] }];
  }

  _run(test) {
    try {
      const actual  = test.run();
      const passed  = actual === test.expected;
      return { name: test.name, passed, actual, expected: test.expected };
    } catch (err) {
      return { name: test.name, passed: false, error: err.message };
    }
  }

  render(container) {
    const suites   = this.runAll();
    const allTests = suites.flatMap(s => s.tests);
    const nPass    = allTests.filter(t => t.passed).length;
    const nFail    = allTests.length - nPass;

    const summary  = document.createElement('div');
    summary.className = `test-summary ${nFail === 0 ? 'pass' : 'fail'}`;
    summary.textContent = `${nPass} / ${allTests.length} tests passed${nFail ? ` — ${nFail} failed` : ' ✓'}`;
    container.appendChild(summary);

    for (const suite of suites) {
      const div = document.createElement('div');
      div.className = 'test-suite';
      div.innerHTML = `<div class="test-suite-name">${escapeHtml(suite.name)}</div>`;

      for (const t of suite.tests) {
        const item = document.createElement('div');
        item.className = `test-item ${t.passed ? 'pass' : 'fail'}`;
        let detail = '';
        if (!t.passed) {
          detail = t.error
            ? ` <span class="detail">Error: ${escapeHtml(t.error)}</span>`
            : ` <span class="detail">got ${escapeHtml(JSON.stringify(t.actual))}, expected ${escapeHtml(JSON.stringify(t.expected))}</span>`;
        }
        item.innerHTML = `<span>${t.passed ? '✅' : '❌'}</span> ${escapeHtml(t.name)}${detail}`;
        div.appendChild(item);
      }
      container.appendChild(div);
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// App — main converter UI
// ═══════════════════════════════════════════════════════════════════════════════

class App {
  constructor(rootEl) {
    this.root     = rootEl;
    this.registry = new ServiceRegistry();
  }

  init() {
    this._renderShell();
    this._bindEvents();
    this._handleURLParams();
  }

  _renderShell() {
    const exampleLinks = this.registry.services
      .map((s, i, arr) => {
        const q = encodeURIComponent(s.exampleValue());
        return `<a class="ex" href="?q=${q}" title="${escapeHtml(s.exampleValue())}">${escapeHtml(s.name)}</a>`;
      })
      .join('\n            ');

    this.root.innerHTML = `
      <div class="container">
        <div class="card" id="input-card">
          <label class="input-label" for="coord-input">
            Enter a map URL, coordinates, sheet code, or geo URI
          </label>
          <div class="input-row">
            <div class="input-wrapper">
              <input
                class="coord-input"
                id="coord-input"
                type="text"
                placeholder="-41.2865, 174.7762"
                autocomplete="off"
                spellcheck="false"
                autofocus
              >
              <button class="btn-clear" id="clear-btn" aria-label="Clear input">✕</button>
            </div>
          </div>
          <div class="examples">
            <button class="examples-toggle" id="examples-toggle" aria-expanded="false" aria-controls="examples-pills">
              Examples <span class="chevron">▾</span>
            </button>
            <div class="examples-pills" id="examples-pills">
              ${exampleLinks}
            </div>
          </div>
        </div>
        <div id="results-card" style="display:none" class="card"></div>
      </div>
      <footer class="app-header">
        <h1>🗺 NZ Map Coordinate Converter</h1>
      </footer>
    `;
  }

  _bindEvents() {
    const input    = document.getElementById('coord-input');
    const clearBtn = document.getElementById('clear-btn');

    const syncClearBtn = () => {
      clearBtn.style.display = input.value ? 'block' : 'none';
    };

    let debounceTimer;
    const debouncedConvert = () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => this._convert(), 400);
    };

    document.getElementById('convert-btn')?.addEventListener('click', () => this._convert());
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { clearTimeout(debounceTimer); this._convert(); }
    });
    input.addEventListener('paste', () => {
      // paste fires before the value updates; skip the debounce and convert immediately
      setTimeout(() => { syncClearBtn(); syncExamples(); this._convert(); }, 0);
    });
    clearBtn.addEventListener('click', () => {
      clearTimeout(debounceTimer);
      input.value = '';
      syncClearBtn();
      syncExamples();
      this._convert();
      input.focus();
    });
    const toggle   = document.getElementById('examples-toggle');
    const pills    = document.getElementById('examples-pills');
    const setExamplesOpen = (open) => {
      pills.classList.toggle('open', open);
      toggle.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', open);
    };
    this._setExamplesOpen = setExamplesOpen;
    toggle.addEventListener('click', () => setExamplesOpen(!pills.classList.contains('open')));

    // Auto-expand when input is empty, auto-collapse when it has content.
    const syncExamples = () => setExamplesOpen(!input.value);
    input.addEventListener('input', () => { syncClearBtn(); syncExamples(); debouncedConvert(); });
    setExamplesOpen(true);

    document.querySelectorAll('.ex').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        const params = new URLSearchParams(new URL(a.href).search);
        input.value = params.get('q') ?? '';
        syncClearBtn();
        syncExamples();
        this._convert();
      });
    });
  }

  _handleURLParams() {
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q');
    if (q) {
      const input    = document.getElementById('coord-input');
      const clearBtn = document.getElementById('clear-btn');
      input.value = q;
      clearBtn.style.display = 'block';
      this._setExamplesOpen(false);
      this._convert();
    }
  }

  _convert() {
    const input      = document.getElementById('coord-input').value.trim();
    const resultsEl  = document.getElementById('results-card');
    if (!input) {
      resultsEl.style.display = 'none';
      history.replaceState(null, '', location.pathname);
      return;
    }

    const result = this.registry.convert(input);
    resultsEl.style.display = 'block';
    resultsEl.innerHTML = result ? this._renderResult(result) : this._renderError(input);

    history.replaceState(null, '', `?q=${encodeURIComponent(input)}`);

    // Wire up copy buttons
    resultsEl.querySelectorAll('.btn-copy').forEach(btn => {
      const originalLabel = btn.textContent;
      btn.addEventListener('click', () => {
        copyToClipboard(btn.dataset.copy ?? '')
          .then(() => {
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
              btn.textContent = originalLabel;
              btn.classList.remove('copied');
            }, 1800);
          })
          .catch(() => {/* silently ignore if all methods fail */});
      });
    });
  }

  _renderResult({ detectedService, coords, links }) {
    const inNZ = isInNZ(coords.lat, coords.lng);
    const warning = inNZ ? '' :
      `<div class="warning-box">⚠️ These coordinates are outside New Zealand.</div>`;

    const visibleLinks = inNZ ? links : links.map(({ service, value }) =>
      service.nzOnly ? { service, value: null } : { service, value }
    );
    const linkRows = visibleLinks.map(({ service, value }) => {
      if (value === null) {
        return `
        <li class="result-item">
          <span class="result-service">${escapeHtml(service.name)}</span>
          <span class="result-value muted">Not available outside NZ</span>
        </li>`;
      }
      const display = service.isURL
        ? `<a href="${escapeHtml(value)}" target="_blank" rel="noopener">Open in ${escapeHtml(service.name)} ↗</a>`
        : escapeHtml(value);
      return `
        <li class="result-item">
          <span class="result-service">${escapeHtml(service.name)}</span>
          <span class="result-value">${display}</span>
          <button class="btn-copy" data-copy="${escapeHtml(value)}">${service.isURL ? 'Copy URL' : 'Copy'}</button>
        </li>`;
    }).join('');

    return `
      <div class="detected-badge"><span class="detected-label">Detected:</span> ${escapeHtml(detectedService.name)}</div>
      ${warning}
      <ul class="result-list">${linkRows}</ul>
    `;
  }

  _renderError(input) {
    const rows = this.registry.services.map(s =>
      `<li><strong>${escapeHtml(s.name)}:</strong> <code style="word-break:break-all">${escapeHtml(s.exampleValue())}</code></li>`
    ).join('');
    return `
      <div class="error-box">
        <p>Could not identify the format of <strong style="word-break:break-all">${escapeHtml(input.substring(0, 80))}${input.length > 80 ? '…' : ''}</strong>.</p>
        <p style="margin-top:.625rem;margin-bottom:.375rem">Supported formats:</p>
        <ul style="list-style:none;display:flex;flex-direction:column;gap:.25rem">${rows}</ul>
      </div>`;
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// Clipboard helper — works on HTTPS (Clipboard API) and HTTP/file:// (execCommand)
// ═══════════════════════════════════════════════════════════════════════════════

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  // Fallback for HTTP / file:// origins
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy') ? resolve() : reject(new Error('execCommand failed'));
    } catch (e) {
      reject(e);
    } finally {
      document.body.removeChild(ta);
    }
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════════════
// Service Worker — registers sw.js for offline support over HTTP(S).
// ═══════════════════════════════════════════════════════════════════════════════

(function registerServiceWorker() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('./sw.js')
    .catch(err => console.warn('Service Worker registration failed:', err));
})();

// ═══════════════════════════════════════════════════════════════════════════════
// Bootstrap
// ═══════════════════════════════════════════════════════════════════════════════

(function () {
  const params = new URLSearchParams(window.location.search);
  const root   = document.getElementById('root');

  if (params.get('run_tests') === 'true') {
    root.innerHTML = `
      <div class="container" id="test-container"></div>
      <footer class="app-header test-header">
        <h1>🧪 NZ Map Converter — Test Suite</h1>
      </footer>
    `;
    const runner = new TestRunner(new ServiceRegistry());
    runner.render(document.getElementById('test-container'));
  } else {
    const app = new App(root);
    app.init();
  }
})();
</script>
